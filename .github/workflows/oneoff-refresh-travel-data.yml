name: One-off refresh travel data

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/oneoff-refresh-travel-data.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Refresh travel data
        run: node scripts/oneoff-refresh-travel-data.mjs

      - name: Validate data
        run: node scripts/validate-data.mjs

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- src/data/trips/pais-vasco-frances.json; then
            echo "No data changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/trips/pais-vasco-frances.json
          git commit -m "content: revisar coordenadas y completar fotos"
          git push
