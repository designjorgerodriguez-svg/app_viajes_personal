name: Temporary content refresh

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/temp-content-refresh.yml"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Update trip content
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('src/data/trips/pais-vasco-frances.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          places = data['places']
          by_id = {p['id']: p for p in places}

          def patch(pid, **changes):
              if pid not in by_id:
                  raise SystemExit(f'Missing expected place: {pid}')
              by_id[pid].update(changes)

          def add(place):
              if place['id'] in by_id:
                  return
              places.append(place)
              by_id[place['id']] = place

          patch(
              'fr-pvf-hendaye-chateau-abbadia',
              tips=[
                  'Reserva la entrada con antelación: el aforo diario está limitado y en verano la reserva es obligatoria.',
                  'Combina la visita con el Domaine d’Abbadia y la Corniche; desde el entorno se obtienen buenas vistas hacia Les Deux Jumeaux.'
              ],
              dogNotes='No he localizado una regla oficial suficientemente clara para el acceso con perro al interior del castillo. El espacio natural exterior tiene sus propias normas y señalización.',
              officialSourceUrl='https://www.hendaye-tourisme.fr/activites-culturelles/chateau-abbadia/'
          )

          patch(
              'fr-pvf-saint-jean-luz-port',
              description='Puerto pesquero y casco histórico de Saint-Jean-de-Luz junto a una bahía protegida. El paseo enlaza fácilmente el puerto, la Place Louis XIV, Rue Gambetta, Les Halles y la Grande Plage.',
              tips=[
                  'Recorre a pie el puerto, la Place Louis XIV y Rue Gambetta; esta última es peatonal y concentra comercios, productos locales y casas tradicionales.',
                  'La Grande Plage queda integrada en el centro y está protegida por los diques de la bahía.',
                  'Si continúas hacia Guéthary por la costa, Erromardie y Lafiténia son dos paradas interesantes; Lafiténia destaca especialmente por el surf y su entorno más natural.'
              ],
              officialSourceUrl='https://www.en-pays-basque.fr/es/costa-vasca/san-juan-de-luz/',
              additionalInfo=[
                  {'label':'Tiempo orientativo','value':'2 – 4 h'},
                  {'label':'Qué ver','value':'Puerto · Rue Gambetta · Place Louis XIV · Les Halles · Grande Plage'},
                  {'label':'Continuación costera','value':'Erromardie · Lafiténia · Guéthary'}
              ]
          )

          patch(
              'fr-pvf-biarritz',
              description='Ciudad costera vasco-francesa con un frente marítimo muy variado. Un recorrido a pie permite enlazar la Grande Plage, Les Halles, el Port des Pêcheurs, el Rocher de la Vierge, Port-Vieux y Villa Belza.',
              tips=[
                  'Haz un recorrido lineal por la costa: Grande Plage, Port des Pêcheurs, Rocher de la Vierge, Port-Vieux, Villa Belza y Côte des Basques.',
                  'Pasa por Les Halles si te apetece ambiente gastronómico y productos locales; están en pleno centro.',
                  'La Chapelle Impériale es un buen complemento si te interesa la etapa imperial de Biarritz; sus visitas tienen horarios concretos y conviene revisarlos antes.'
              ],
              officialSourceUrl='https://www.destination-biarritz.fr/decouvrir/les-incontournables-a-biarritz/',
              additionalInfo=[
                  {'label':'Interés','value':'Rocher de la Vierge · Port des Pêcheurs · Les Halles · Villa Belza · Chapelle Impériale'},
                  {'label':'Tiempo orientativo','value':'4 h – día completo'},
                  {'label':'Consejo','value':'Mejor como paseo urbano a pie, sin mover el vehículo entre paradas'}
              ]
          )

          patch(
              'fr-pvf-espelette',
              description='Pueblo labortano conocido por el Piment d’Espelette y por sus casas tradicionales de fachadas blancas con entramados rojos. En temporada es habitual ver ristras de pimientos secándose en fachadas y balcones.',
              tips=[
                  'Recorre el centro a pie fijándote en la arquitectura tradicional y las fachadas decoradas con pimientos.',
                  'Es una parada especialmente buena para comprar productos locales y probar cocina vinculada al Piment d’Espelette.',
                  'El entorno del Latsa completa bien la visita si quieres alejarte un poco de las calles principales.'
              ],
              additionalInfo=[
                  {'label':'Tiempo orientativo','value':'1 – 1 h 30'},
                  {'label':'Interés','value':'Arquitectura vasca · pimiento · productos locales · río Latsa'}
              ]
          )

          patch(
              'fr-pvf-sare',
              description='Pueblo vasco de Xareta, clasificado entre Les Plus Beaux Villages de France y situado a los pies de La Rhune. Es una buena base para combinar arquitectura tradicional, las Grottes de Sare, Ortillopitz y el tren de La Rhune.',
              tips=[
                  'Combínalo especialmente bien con el tren de La Rhune, Ortillopitz y las Grottes de Sare.',
                  'El pueblo merece un paseo corto por la plaza, la iglesia y las casas tradicionales antes de continuar hacia las visitas de los alrededores.'
              ],
              additionalInfo=[
                  {'label':'Tiempo orientativo','value':'1 – 1 h 30 en el pueblo'},
                  {'label':'Interés','value':'Plaza · iglesia · casas vascas · La Rhune · Grottes de Sare · Ortillopitz'}
              ]
          )

          patch(
              'fr-pvf-ainhoa',
              tips=[
                  'Es una parada corta y muy fotogénica; recorre a pie la calle principal y fíjate en las casas labortanas alineadas.',
                  'Combina muy bien con Sare y Espelette en una ruta por el interior.'
              ],
              additionalInfo=[
                  {'label':'Tiempo orientativo','value':'45 min – 1 h 15'},
                  {'label':'Interés','value':'Calle principal · iglesia · cementerio · arquitectura vasca'},
                  {'label':'Combina con','value':'Sare · Espelette'}
              ]
          )

          patch(
              'fr-pvf-sare-train-rhune',
              tips=[
                  'Reserva con antelación en temporada alta; las plazas son limitadas y los horarios dependen del día.',
                  'Consulta la meteorología o la webcam antes de subir: con niebla se pierde buena parte de las vistas.',
                  'La excursión clásica dura unas 2 h 30 entre subida, estancia en la cima y descenso.'
              ],
              dogAccess='conditional',
              dogNotes='Los perros están admitidos en el tren y deben viajar entre las piernas, bajo el banco, para no molestar. En la cima hay ganado y espacio Natura 2000, así que deben ir muy controlados.',
              officialSourceUrl='https://www.rhune.com/fr/faq/',
              additionalInfo=[
                  {'label':'Salida','value':'Gare du Col de Saint-Ignace · Sare'},
                  {'label':'Tiempo orientativo','value':'Aprox. 2 h 30'},
                  {'label':'Cima','value':'La Rhune · 905 m'}
              ]
          )

          patch(
              'fr-pvf-saint-jean-pied-port-citadelle',
              description='Ciudadela y casco fortificado de Saint-Jean-Pied-de-Port, última gran etapa francesa del Camino de Santiago antes de cruzar los Pirineos hacia Roncesvalles.',
              tips=[
                  'Sube hasta la ciudadela para tener vistas sobre el casco y después baja por Rue de la Citadelle.',
                  'Incluye la Rue d’Espagne, histórica calle de comerciantes y artesanos, y el Pont d’Eyheraberry sobre la Nive.',
                  'La Porte Saint-Jacques forma parte del conjunto del Camino de Santiago reconocido por la UNESCO.'
              ],
              officialSourceUrl='https://www.en-pays-basque.fr/territoires-et-destinations/le-pays-de-saint-jean-pied-de-port/saint-jean-pied-de-port/',
              additionalInfo=[
                  {'label':'Tiempo orientativo','value':'2 – 3 h'},
                  {'label':'Qué ver','value':'Ciudadela · Porte Saint-Jacques · Rue d’Espagne · Pont d’Eyheraberry · casco histórico'}
              ]
          )

          patch(
              'fr-pvf-baigorri',
              description='Pueblo del valle de Baigorri, junto a la Nive des Aldudes y rodeado por colinas verdes y viñedos de la AOC Irouléguy. Es una buena base para recorrer el paisaje rural del interior.',
              tips=[
                  'Combínalo con la bodega de Irouléguy y con un paseo por el entorno del río.',
                  'Dedica parte del trayecto a las carreteras del valle: el paisaje de viñedos en ladera y colinas es uno de los principales atractivos de esta zona.'
              ],
              additionalInfo=[
                  {'label':'Tiempo orientativo','value':'1 – 1 h 30 en el pueblo'},
                  {'label':'Interés','value':'Puente · río · iglesia · valle de Baigorri · viñedos de Irouléguy'}
              ]
          )

          patch(
              'fr-pvf-larrau-holzarte',
              description='Pasarela colgante sobre las gargantas de Olhadubi, en la Haute-Soule, suspendida a gran altura y accesible mediante una ruta de montaña desde Logibar, cerca de Larrau.',
              tips=[
                  'Lleva buen calzado: el acceso es una ruta de montaña y puede resultar resbaladiza.',
                  'El entorno de Larrau y el río Saison/Gave de Larrau merece el desplazamiento aunque finalmente no completes la ruta.',
                  'Si buscas una alternativa de visita en la Haute-Soule, la Grotte de La Verna permite una experiencia completamente distinta y requiere reserva.'
              ],
              additionalInfo=[
                  {'label':'Ruta corta','value':'Aprox. 2 h ida/vuelta hasta la pasarela'},
                  {'label':'Entorno','value':'Gargantas · bosque · Larrau · Haute-Soule'}
              ]
          )

          add({
              'id':'fr-pvf-hendaye-centre','tripId':'pais-vasco-frances','name':'Hendaye / Hendaya · centro','locality':'Hendaye, Pyrénées-Atlantiques','categoryId':'city','latitude':43.3587,'longitude':-1.77459,
              'imageUrl':'','imageSourceUrl':'','imageAttribution':'','alt':'',
              'description':'Centro histórico de Hendaya en torno a la Place de la République y la iglesia Saint-Vincent, con el frontón Gaztelu Zahar, restos de las fortificaciones de Vauban, vistas hacia Hondarribia y el antiguo puerto de Caneta.',
              'tips':['Recorre el centro a pie y enlaza la iglesia Saint-Vincent, Gaztelu Zahar y el antiguo puerto de Caneta.','Para completar Hendaya, separa esta visita urbana de Abbadia, la Corniche y la gran playa.'],
              'price':None,'dogAccess':'unknown','dogNotes':'No he localizado una norma única y oficial para perros que cubra todo el recorrido urbano; revisa señalización e interiores.',
              'officialSourceUrl':'https://www.tourisme64.com/animation/hendaye/FMAAQU064V5C9ZF5-visite-dhendaye-centre-ville/','googleMapsUrl':'https://www.google.com/maps/search/?api=1&query=Hendaye%20centre%20ville',
              'additionalInfo':[{'label':'Tiempo orientativo','value':'1 – 2 h'},{'label':'Interés','value':'Casco urbano · puerto de Caneta · Gaztelu Zahar · vistas a Hondarribia'}]
          })

          add({
              'id':'fr-pvf-hendaye-corniche','tripId':'pais-vasco-frances','name':'Corniche Basque · Abbadia y Les Deux Jumeaux','locality':'Hendaye, Pyrénées-Atlantiques','categoryId':'hiking','latitude':43.3772,'longitude':-1.74407,
              'imageUrl':'','imageSourceUrl':'','imageAttribution':'','alt':'',
              'description':'Tramo de costa protegida entre acantilados, landas y el Domaine d’Abbadia, con panorámicas sobre el Atlántico y los dos roquedos de Les Deux Jumeaux.',
              'tips':['Hazlo con calzado cómodo y evita acercarte al borde de los acantilados fuera de los senderos.','Combina especialmente bien con el Castillo de Abbadia y la playa de Hendaya.'],
              'price':None,'dogAccess':'unknown','dogNotes':'Es un espacio natural protegido; no he localizado una regla única suficientemente clara para todo el recorrido. Sigue la señalización del tramo y lleva al perro controlado.',
              'officialSourceUrl':'https://www.hendaye-tourisme.fr/accueil/ITIAQU064FS00041-abbadia-entre-ciel-et-mer/','googleMapsUrl':'https://www.google.com/maps/search/?api=1&query=Corniche%20Basque%20Hendaye%20Deux%20Jumeaux',
              'additionalInfo':[{'label':'Interés','value':'Acantilados · flysch · Domaine d’Abbadia · Les Deux Jumeaux'},{'label':'Tiempo orientativo','value':'1 h 30 – 3 h según recorrido'}]
          })

          add({
              'id':'fr-pvf-guethary','tripId':'pais-vasco-frances','name':'Guéthary','locality':'Guéthary, Pyrénées-Atlantiques','categoryId':'village','latitude':43.4252,'longitude':-1.6099,
              'imageUrl':'https://commons.wikimedia.org/wiki/Special:Redirect/file/Port%20de%20Guethary.jpg?width=1200','imageSourceUrl':'https://commons.wikimedia.org/wiki/File:Port_de_Guethary.jpg','imageAttribution':'Pkayne · CC BY-SA 4.0','alt':'Puerto de Guéthary y su pequeño frente marítimo',
              'description':'Pequeño pueblo marinero entre Saint-Jean-de-Luz y Bidart, volcado hacia el océano. Su puerto en seco, el frente marítimo y el entorno de Parlementia concentran buena parte de su encanto.',
              'tips':['Haz una parada corta por el puerto y sube hacia el sémaphore para tener perspectiva sobre la costa.','Parlementia es un spot de surf potente: mejor para observar si no tienes experiencia suficiente.','No confundas este Guéthary francés con Getaria, en Gipuzkoa: el Monte San Antón pertenece a la localidad española.'],
              'price':None,'dogAccess':'unknown','dogNotes':'Las playas tienen normas estacionales propias; por ejemplo, Parlementia restringe perros durante el periodo de vigilancia. Revisa la señalización del día.',
              'officialSourceUrl':'https://www.en-pays-basque.fr/territoires-et-destinations/cote-basque/guethary/','googleMapsUrl':'https://www.google.com/maps/search/?api=1&query=Gu%C3%A9thary%20France',
              'additionalInfo':[{'label':'Tiempo orientativo','value':'1 – 2 h'},{'label':'Interés','value':'Puerto · sémaphore · Parlementia · paseo costero'}]
          })

          add({
              'id':'fr-pvf-bayonne','tripId':'pais-vasco-frances','name':'Bayonne / Bayona','locality':'Bayonne, Pyrénées-Atlantiques','categoryId':'city','latitude':43.4941,'longitude':-1.47861,
              'imageUrl':'','imageSourceUrl':'','imageAttribution':'','alt':'',
              'description':'Ciudad histórica en la confluencia del Nive y el Adour. El recorrido urbano combina los muelles del Nive, Grand Bayonne, el Château-Vieux, las murallas y el barrio de Saint-Esprit, hoy muy ligado al street art.',
              'tips':['Recorre los quais de la Nive y el casco histórico alrededor de la catedral y Château-Vieux.','Cruza a Saint-Esprit para ver sus murales; Rue Sainte-Catherine y Rue Ulysse-Darracq concentran varias obras conocidas.','Bayona se disfruta especialmente bien caminando, alternando patrimonio, mercado y riberas.'],
              'price':None,'dogAccess':'conditional','dogNotes':'Los recorridos urbanos exteriores son compatibles con perro, pero museos, iglesias, jardines y otros interiores aplican normas propias.',
              'officialSourceUrl':'https://www.visitbayonne.com/es/descubra/que-ver-y-hacer-en-bayona/visitar-bayona/arte-callejero-en-bayona/','googleMapsUrl':'https://www.google.com/maps/search/?api=1&query=Bayonne%20France',
              'additionalInfo':[{'label':'Tiempo orientativo','value':'3 – 5 h'},{'label':'Interés','value':'Nive · Château-Vieux · casco histórico · Saint-Esprit · street art'}]
          })

          add({
              'id':'fr-pvf-sare-grottes','tripId':'pais-vasco-frances','name':'Grottes de Sare / Sarako Lezea','locality':'Sare, Pyrénées-Atlantiques','categoryId':'nature','latitude':43.2687,'longitude':-1.57134,
              'imageUrl':'','imageSourceUrl':'','imageAttribution':'','alt':'',
              'description':'Cuevas prehistóricas de Sare con visita guiada de aproximadamente una hora, museo del sitio y parque megalítico. El interior se mantiene alrededor de 14 °C.',
              'tips':['Reserva antes, especialmente en verano y en días de lluvia: el número de visitantes por pase es limitado.','Llega unos 20 minutos antes y lleva una capa ligera; dentro se mantienen unos 14 °C.','No se permiten animales, cochecitos ni fotografías o vídeo dentro de la cueva.'],
              'price':{'label':'Tarifas 2026 · adulto 10 € · 14–17 años y estudiantes 8,50 € · 5–13 años 6 € · familia 32 €'},
              'dogAccess':'not-allowed','dogNotes':'Los animales no están admitidos dentro de la cueva.','officialSourceUrl':'https://www.grottesdesare.fr/es/horaire_tarif_es.php','googleMapsUrl':'https://www.google.com/maps/search/?api=1&query=Grottes%20de%20Sare',
              'additionalInfo':[{'label':'Dirección','value':'2280 Lezeko bidea · 64310 Sare'},{'label':'Tiempo orientativo','value':'1 h 30 – 2 h con museo y parque'}]
          })

          add({
              'id':'fr-pvf-sare-ortillopitz','tripId':'pais-vasco-frances','name':'Ortillopitz · Maison Basque de Sare','locality':'Sare, Pyrénées-Atlantiques','categoryId':'monument','latitude':43.3239,'longitude':-1.58837,
              'imageUrl':'','imageSourceUrl':'','imageAttribution':'','alt':'',
              'description':'Casa labortana del siglo XVII restaurada para explicar la arquitectura, la vida doméstica y la cultura tradicional vasca.',
              'tips':['En 2026 abre del 5 de abril al 25 de septiembre y cierra los sábados.','La visita libre funciona de domingo a viernes de 11:00 a 16:30; las guiadas salen lunes, martes y miércoles a las 10:00 y requieren reserva.','Está a aproximadamente 1 km de la estación del tren de La Rhune, por lo que ambas visitas combinan bien.'],
              'price':{'label':'Tarifas 2026 · visita libre 7 € · visita guiada 10 € · menores de 4 años gratis en visita libre'},
              'dogAccess':'not-allowed','dogNotes':'Los animales no están admitidos.','officialSourceUrl':'https://www.ortillopitz.fr/preparez-votre-visite/','googleMapsUrl':'https://www.google.com/maps/search/?api=1&query=Ortillopitz%20Sare',
              'additionalInfo':[{'label':'Dirección','value':'875 Igeltsutegiko bidea · 64310 Sare'},{'label':'Tiempo orientativo','value':'45 min – 1 h'}]
          })

          add({
              'id':'fr-pvf-la-bastide-clairence','tripId':'pais-vasco-frances','name':'La Bastide-Clairence','locality':'La Bastide-Clairence, Pyrénées-Atlantiques','categoryId':'village','latitude':43.4295,'longitude':-1.25609,
              'imageUrl':'https://www.tourisme64.com/wp-content/uploads/2024/07/la-bastide-clairence-30-09-23-222-1536x912.jpg','imageSourceUrl':'https://www.tourisme64.com/nos-destinations/pays-basque/la-bastide-clairence/','imageAttribution':'Tourisme 64','alt':'Place des Arceaux y casas tradicionales de La Bastide-Clairence',
              'description':'Bastida medieval del siglo XIV clasificada entre Les Plus Beaux Villages de France, con trazado en damero, Place des Arceaux, iglesia, arquitectura labortana y navarra y una fuerte tradición artesanal.',
              'tips':['Los martes de verano hay mercado de productores en la Place des Arceaux; en 2026 funciona de 9:00 a 13:00 en las fechas publicadas.','Jungle Canoë propone en julio y agosto un recorrido de unas 2 horas en el entorno de La Bastide-Clairence; fuera del verano opera en la Nive con fórmula guiada.','Recorre el pueblo a pie y entra en los talleres artesanos que estén abiertos.'],
              'price':None,'dogAccess':'conditional','dogNotes':'El pueblo y varias visitas exteriores admiten animales, pero la iglesia y determinados establecimientos pueden restringir el acceso.',
              'officialSourceUrl':'https://www.tourisme64.com/activites/la-bastide-clairence/PCUAQU064V5BUXNJ-la-bastide-clairence-classe-les-plus-beaux-villages-de-france/','googleMapsUrl':'https://www.google.com/maps/search/?api=1&query=La%20Bastide-Clairence',
              'additionalInfo':[{'label':'Mercado','value':'Martes de verano · 09:00–13:00 · confirmar fecha concreta'},{'label':'Tiempo orientativo','value':'1 h 30 – 3 h'},{'label':'Extra','value':'Jungle Canoë · actividad estacional'}]
          })

          add({
              'id':'fr-pvf-tardets','tripId':'pais-vasco-frances','name':'Tardets-Sorholus / Atharratze-Sorholüze','locality':'Tardets-Sorholus, Pyrénées-Atlantiques','categoryId':'village','latitude':43.1164,'longitude':-0.8625,
              'imageUrl':'','imageSourceUrl':'','imageAttribution':'','alt':'',
              'description':'Pequeña bastida de la Haute-Soule situada al pie de las colinas de La Madeleine y bien colocada como base para Holzarte, Larrau, Sainte-Engrâce y La Verna.',
              'tips':['Haz una parada por la plaza y el casco antes de continuar hacia la Haute-Soule.','La chapelle de la Madeleine, accesible desde el entorno de Tardets, ofrece una panorámica de 360° sobre Soule y las montañas del Béarn.','Es una base práctica para elegir entre la ruta de Holzarte, Erretzü o la Grotte de La Verna.'],
              'price':None,'dogAccess':'unknown','dogNotes':'No he localizado una norma turística única para todo el pueblo; respeta señalización e interiores.',
