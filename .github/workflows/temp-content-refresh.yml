              'price':None,'dogAccess':'unknown','dogNotes':'No he localizado una norma única para todo el casco urbano; revisa interiores y señalización.',
              'officialSourceUrl':'https://www.tourisme64.com/es/nuestros-destinos/bienvenido-al-pais-vasco/mauleon-licharre/','googleMapsUrl':'https://www.google.com/maps/search/?api=1&query=Maul%C3%A9on-Licharre',
              'additionalInfo':[{'label':'Tiempo orientativo','value':'1 – 2 h'},{'label':'Interés','value':'Soule · tradición de la alpargata · casco urbano'}]
          })

          add({
              'id':'fr-pvf-tardets-erretzu','tripId':'pais-vasco-frances','name':'Erretzü · ruta desde Tardets','locality':'Tardets-Sorholus, Pyrénées-Atlantiques','categoryId':'hiking','latitude':43.1164,'longitude':-0.8625,
              'imageUrl':'','imageSourceUrl':'','imageAttribution':'','alt':'',
              'description':'Ruta de media montaña desde Tardets hacia el Erretzü, con bosques, helechales y amplias vistas sobre las montañas del Béarn y la Haute-Soule.',
              'tips':['La ruta oficial marca unos 10 km, 4 horas y 500 m de desnivel positivo; nivel medio.','Lleva agua y calzado de senderismo y evita hacerla con mala visibilidad si tu objetivo principal son las panorámicas.'],
              'price':None,'dogAccess':'unknown','dogNotes':'No he localizado una indicación oficial específica sobre perros para todo el itinerario; es zona rural y pastoral, por lo que debe ir controlado y con correa cerca de ganado.',
              'officialSourceUrl':'https://www.tourisme64.com/itineraire/tardets-sorholus/ITIAQU064V5AYWBF-erretzu/','googleMapsUrl':'https://www.google.com/maps/search/?api=1&query=Erretz%C3%BC%20Tardets',
              'additionalInfo':[{'label':'Ruta','value':'10 km · 4 h · +500 m · dificultad media'},{'label':'Interés','value':'Panorámicas · bosque · helechales · Haute-Soule'}]
