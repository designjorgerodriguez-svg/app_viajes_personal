              'additionalInfo':[{'label':'Tiempo orientativo','value':'45 min – 1 h 30'},{'label':'Interés','value':'Bastida · Haute-Soule · La Madeleine · base para excursiones'}]
          })

          add({
              'id':'fr-pvf-mauleon-licharre','tripId':'pais-vasco-frances','name':'Mauléon-Licharre / Maule-Lextarre','locality':'Mauléon-Licharre, Pyrénées-Atlantiques','categoryId':'village','latitude':43.2242,'longitude':-0.8869,
              'imageUrl':'','imageSourceUrl':'','imageAttribution':'','alt':'',
