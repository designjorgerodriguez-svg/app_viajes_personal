name: One-off improve travel photos

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  improve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Improve selected photos and mobile framing
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'src/data/trips/pais-vasco-frances.json'
          const trip = JSON.parse(fs.readFileSync(path, 'utf8'))

          const updates = {
            'fr-pvf-espelette': {
              imageUrl: 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Espelette.jpg?width=1600',
              imageSourceUrl: 'https://commons.wikimedia.org/wiki/File:Espelette.jpg',
              imageAttribution: 'Anne-Liam · CC BY-SA 4.0',
              alt: 'Vista luminosa del pueblo de Espelette y sus casas tradicionales'
            },
            'fr-pvf-ainhoa': {
              imageUrl: 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Ainhoa%20rue%20principale.jpg?width=1600',
              imageSourceUrl: 'https://commons.wikimedia.org/wiki/File:Ainhoa_rue_principale.jpg',
              imageAttribution: 'Harrieta171 · CC BY-SA 3.0',
              alt: 'Calle principal de Ainhoa con sus casas tradicionales vascas'
            },
            'fr-landes-labenne-plage-centrale': {
              imageUrl: 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Labenne-plage%2014.JPG?width=1600',
              imageSourceUrl: 'https://commons.wikimedia.org/wiki/File:Labenne-plage_14.JPG',
              imageAttribution: 'Traumrune · CC BY-SA 3.0',
              alt: 'Amplia playa de Labenne-Océan con arena, olas y horizonte atlántico'
            },
            'fr-landes-messanges-plage-sud': {
              imageUrl: 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Messanges%20%281%29.jpg?width=1600',
              imageSourceUrl: 'https://commons.wikimedia.org/wiki/File:Messanges_%281%29.jpg',
              imageAttribution: 'loewensprung · CC BY 2.0',
              alt: 'Playa de Messanges con dunas, arena y océano Atlántico'
            }
          }

          for (const place of trip.places) {
            if (updates[place.id]) Object.assign(place, updates[place.id])
          }
          fs.writeFileSync(path, JSON.stringify(trip, null, 2) + '\n')

          const cssPath = 'src/styles/app.css'
          let css = fs.readFileSync(cssPath, 'utf8')
          css = css.replace(
            ".place-card__visual img {\n  width: 100%;\n  height: 100%;\n  object-fit: cover;\n}",
            ".place-card__visual img {\n  width: 100%;\n  height: 100%;\n  object-fit: cover;\n  object-position: center 45%;\n}"
          )
          css = css.replace(
            "height: clamp(146px, 21svh, 160px);",
            "height: clamp(190px, 28svh, 230px);"
          )
          css = css.replace(
            "object-position: center center;",
            "object-position: center 45%;"
          )
          fs.writeFileSync(cssPath, css)
          NODE

          git rm .github/workflows/oneoff-improve-photos.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/trips/pais-vasco-frances.json src/styles/app.css
          git commit -m "ui: mejorar fotos y encuadre móvil"
          git push
