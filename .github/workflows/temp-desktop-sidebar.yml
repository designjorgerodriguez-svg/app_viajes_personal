name: Temporary desktop sidebar refresh

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/temp-desktop-sidebar.yml"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Update desktop navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          nav_path = Path('src/components/navigation/BottomNavigation.tsx')
          nav = nav_path.read_text(encoding='utf-8')

          nav = nav.replace(
              "        <div className=\"brand-mark\" aria-hidden=\"true\">\n          B\n        </div>",
              "        <div className=\"brand-mark\" aria-label=\"Brújula\">\n          <img src={`${import.meta.env.BASE_URL}favicon.svg`} alt=\"\" aria-hidden=\"true\" />\n        </div>"
          )

          nav = nav.replace(
              "              <span className=\"nav-icon\">\n                <Icon\n                  fill={id === 'favorites' && isActive ? 'currentColor' : 'none'}\n                  size={21}\n                  strokeWidth={isActive ? 2.4 : 1.9}\n                />\n              </span>\n            </button>",
              "              <span className=\"nav-icon\">\n                <Icon\n                  fill={id === 'favorites' && isActive ? 'currentColor' : 'none'}\n                  size={21}\n                  strokeWidth={isActive ? 2.4 : 1.9}\n                />\n              </span>\n              <span className=\"nav-label\">{label}</span>\n            </button>"
          )

          nav_path.write_text(nav, encoding='utf-8')

          css_path = Path('src/styles/app.css')
          css = css_path.read_text(encoding='utf-8')

          css = css.replace(
              ".nav-item[data-active='true'] {\n  color: #fff;\n  background: transparent;\n}\n\n.nav-icon {",
              ".nav-item[data-active='true'] {\n  color: #fff;\n  background: transparent;\n}\n\n.nav-label {\n  display: none;\n}\n\n.nav-icon {"
          )

          css = css.replace(
              "    grid-template-columns: 102px minmax(0, 1fr);",
              "    grid-template-columns: 220px minmax(0, 1fr);",
              1
          )

          css = css.replace(
              "    padding: 18px 9px;\n    flex-direction: column;\n    gap: 7px;",
              "    padding: 22px 14px;\n    flex-direction: column;\n    gap: 7px;"
          )

          old_brand = """  .brand-mark {
    display: grid;
    width: 46px;
    height: 46px;
    margin-bottom: 24px;
    color: #fff;
    background: var(--color-primary-strong);
    border-radius: 16px;
    place-items: center;
    font-size: 1.05rem;
    font-weight: 900;
  }

  .nav-item {
    width: 100%;
    min-height: 67px;
  }
"""

          new_brand = """  .brand-mark {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 58px;
    margin-bottom: 24px;
    padding: 0 14px;
  }

  .brand-mark img {
    display: block;
    width: 52px;
    height: 52px;
    flex: 0 0 52px;
    border-radius: 17px;
  }

  .nav-item {
    justify-content: flex-start;
    gap: 12px;
    width: 100%;
    min-height: 58px;
    padding: 0 14px;
    border-radius: 18px;
    text-align: left;
  }

  .nav-label {
    display: inline-block;
    color: inherit;
    font-size: 0.86rem;
    font-weight: 750;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }

  .nav-item[data-active='true'] {
    background: rgb(255 255 255 / 10%);
  }

  .nav-item[data-active='true'] .nav-icon {
    transform: none;
  }
"""

          if old_brand not in css:
              raise SystemExit('Desktop navigation CSS block not found')
          css = css.replace(old_brand, new_brand)

          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-desktop-sidebar.yml
          git add src/components/navigation/BottomNavigation.tsx src/styles/app.css
          git commit -m "Mejora menú lateral de escritorio"
          git push
