name: One-off add blog Bordeaux places

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/oneoff-add-blog-bordeaux-places.mjs"
      - ".github/workflows/oneoff-add-blog-bordeaux-places.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add researched places
        run: node scripts/oneoff-add-blog-bordeaux-places.mjs
      - name: Validate data
        run: pnpm validate:data
      - name: Build
        run: pnpm exec tsc -b && pnpm exec vite build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/trips/pais-vasco-frances.json
          git diff --cached --quiet || git commit -m "content: añadir paradas seleccionadas hacia Burdeos"
          git push
