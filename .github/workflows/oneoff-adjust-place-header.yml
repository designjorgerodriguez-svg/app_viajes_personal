name: One-off adjust place header

on:
  push:
    paths:
      - 'scripts/oneoff-adjust-place-header.mjs'
      - '.github/workflows/oneoff-adjust-place-header.yml'

permissions:
  contents: write

jobs:
  update-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: node scripts/oneoff-adjust-place-header.mjs
      - run: pnpm validate:data
      - run: pnpm exec tsc -b

      - name: Commit updated UI
        run: |
          if git diff --quiet -- src/features/places/PlaceDetails.tsx src/styles/app.css; then
            echo "No UI changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/places/PlaceDetails.tsx src/styles/app.css
          git commit -m "ui: permitir títulos largos en fichas"
          git push origin main
