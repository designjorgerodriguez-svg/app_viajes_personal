name: One-off add Peñalara

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/oneoff-add-penalara.mjs"
      - ".github/workflows/oneoff-add-penalara.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Add Peñalara
        run: node scripts/oneoff-add-penalara.mjs
      - name: Validate data
        run: pnpm validate:data
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/trips/pais-vasco-frances.json
          git diff --cached --quiet || git commit -m "feat: añadir Pico de Peñalara"
          git push
