name: One-off add Hossegor nature

on:
  push:
    paths:
      - 'scripts/oneoff-add-hossegor-nature.mjs'
      - '.github/workflows/oneoff-add-hossegor-nature.yml'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: node scripts/oneoff-add-hossegor-nature.mjs
      - run: pnpm validate:data
      - run: pnpm exec tsc -b

      - name: Commit updated trip data
        run: |
          if git diff --quiet -- src/data/trips/pais-vasco-frances.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/trips/pais-vasco-frances.json
          git commit -m "content: ampliar naturaleza y perros en Hossegor"
          git push origin main
