name: One-off improve water photos

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/oneoff-improve-water-photos.mjs"
      - ".github/workflows/oneoff-improve-water-photos.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Update travel photos
        run: node scripts/oneoff-improve-water-photos.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/trips/pais-vasco-frances.json
          git diff --cached --quiet || git commit -m "content: mejorar fotos de playas y baños"
          git push
